name: Lab daily learning

# The draft lab's long-running learner. Each run:
#   1. lists AD games for the top players and for up to 100 more players who
#      keep showing up in the saved games (so the data set keeps growing),
#   2. pulls up to 3,000 new games from OpenDota,
#   3. scores the saved neural model on the games it has never seen (the honest
#      forward test, logged to lab/ml/history.json), then trains it on them.
# Started daily by a push to lab/ml/tick.txt, by hand, or (once this file is on
# the default branch) by the schedule. It never deploys anything.
on:
  push:
    paths:
      - lab/ml/tick.txt
      - .github/workflows/lab-learn.yml
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      games:
        description: Most new games to pull
        default: '3000'
      discover:
        description: New players to list
        default: '100'

concurrency: lab-ad-games

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install training libraries
        run: pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Pull new games (commits every 500)
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TOTAL: ${{ github.event.inputs.games || '3000' }}
          DISCOVER: ${{ github.event.inputs.discover || '100' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          done=0; disc=$DISCOVER
          while [ "$done" -lt "$TOTAL" ]; do
            out=$(python3 lab/tools/fetch-ad-games.py --max 500 --discover "$disc" | tee /dev/stderr)
            disc=0
            added=$(echo "$out" | sed -n 's/^Added \([0-9]*\) games.*/\1/p')
            git add -A lab/data
            git diff --cached --quiet || git commit -q -m "Lab: pull AD games"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
            [ "${added:-0}" -eq 0 ] && break
            done=$((done + added))
          done
          echo "Added this run: $done"
      - name: Build judge features
        run: cd lab && node tools/ad-games-features.js > runs/ad-games-features.json
      - name: Forward-test, then train the model
        run: cd lab && python3 ml/net.py train --warm
      - name: Save the model and its history
        run: |
          git add lab/ml/model.pt lab/ml/history.json lab/ml/status.json lab/runs/ad-games-features.json
          git diff --cached --quiet || git commit -q -m "Lab: daily model update"
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 10; done
