name: Deploy to Cloudflare Pages

# Deploys to the "testing" branch alias (testing.<project>.pages.dev), never production.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The page can't load without these, so refuse to deploy a broken site.
      - name: Check data files are present
        run: |
          for f in heroes_abilities.json ability_synergies.json; do
            test -s "public/$f" || { echo "::error::public/$f is missing"; exit 1; }
          done

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=testing
