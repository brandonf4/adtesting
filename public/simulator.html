    <div class="title">${seatName} proposes <b>${c ? c.display_name : 'nothing'}</b>${c ? ` (${catLabel[categoryOf(c)]}${c.kind === 'ability' ? ', ' + c.hero : ''})` : ''} — pick ${pickIndex + 1} of ${PICK_ORDER.length}</div>
    <button class="reset-btn" id="bot-panel-toggle">${botPanelCollapsed ? 'Show details' : 'Hide details'}</button>
  </div><div class="bot-panel-body">`;
  if (d.random) {
    html += `<div>Screenshot pool: options have no data, so the bot picks at random.</div>`;
  } else {
    if (d.deferredCats && d.deferredCats.length) {
      html += `<div style="margin-bottom:6px;color:#f4c542">Deferred (hard override): ${d.deferredCats.map(c => catLabel[c]).join(', ')}. Every enemy picking before this player's next turn (${(d.enemiesBeforeNext || []).map(e => 'P' + (e + 1)).join(', ') || 'none'}) has filled ${d.deferredCats.length > 1 ? 'these categories' : 'this category'}, so nothing in it can be taken before then.</div>`;
    }
    if (d.undeferredCats && d.undeferredCats.length) {
      html += `<div style="margin-bottom:6px;color:#9ec3ff">Not deferred: ${d.undeferredCats.map(c => catLabel[c]).join(' and ')} are both filled by every enemy picking before the next turn (${(d.enemiesBeforeNext || []).map(e => 'P' + (e + 1)).join(', ')}), but not by all 5 enemies, so either is allowed and scarcity decides.</div>`;
    }
    const cols = [['base', 'Base'], ['ownSynergy', 'Own synergy'], ['combo', 'Known combo'], ['pool', 'Pool upside'], ['enemy', 'Enemy denial'], ['ally', 'Ally avoid'], ['scarcity', 'Scarcity'], ['total', 'Total']];
    html += `<table><thead><tr><th>Option (top ${Math.min(10, d.rows.length)} of ${d.rows.length})</th>${cols.map(([k, l]) => `<th data-col="${k}">${l}</th>`).join('')}</tr></thead><tbody>`;
    d.rows.slice(0, 10).forEach((r, ri) => {
      const it = r.item;
      const label = `${it.display_name} <span style="color:#888">· ${catLabel[categoryOf(it)]}${it.kind === 'ability' ? ' · ' + it.hero : ''}</span>`;
      const deferred = d.deferredCats && d.deferredCats.includes(categoryOf(it));
      html += `<tr class="${it === c ? 'chosen' : ''}"${deferred ? ' style="opacity:0.45"' : ''}><td>${label}${deferred ? ' <span style="color:#f4c542">(deferred)</span>' : ''}</td>` + cols.map(([k]) => {
        const at = `data-col="${k}" data-row="${ri}"`;
        if (k === 'base') return `<td ${at}>${Number.isFinite(r.base) ? shown(r.base).toFixed(1) : 'no data'}</td>`;
        if (k === 'total') return `<td class="total" ${at}>${Number.isFinite(r.total) ? shown(r.total).toFixed(1) : '—'}</td>`;
        const f = fmtPart(r[k]);
        return `<td class="${f.cls}" ${at}>${f.text}</td>`;
      }).join('') + `</tr>`;
    });
    html += `</tbody></table>`;
    html += `<div class="consts">Higher total = picked first. Base = windrun Strength; every adjustment is shown at ½ of its tuned size, good effects as +. Tuned constants now: synergy multiplier ${synergyMultiplier().toFixed(2)} (${SYNERGY_MULTIPLIER_BASE} + ${SYNERGY_MULTIPLIER_INCREMENT}×pick), known-combo bonus ${knownComboBonus().toFixed(2)} (${KNOWN_COMBO_BONUS_COEFFICIENT}×pick²), pool upside weight ${POOL_SYNERGY_WEIGHTS_BY_PICKS_MADE[picks[d.seat].length]}, order weights [${SYNERGY_ORDER_WEIGHTS.join(', ')}], scarcity weight ${SCARCITY_WEIGHT} (cap ${SCARCITY_CAP}), enemy denial and ally avoid use the same weight and cap, applied to how far each player's kept option drops.</div>`;
  }
  html += `</div>`;
  panel.innerHTML = html;
  document.getElementById('bot-panel-toggle').addEventListener('click', () => { botPanelCollapsed = !botPanelCollapsed; renderBotPanel(); });
}

function renderLog() {
  document.getElementById('log').innerHTML = logEntries.slice().reverse().map(e =>
    `<div class="log-entry${e.isYou ? ' you' : ''}">Player ${e.player + 1} picked ${e.name}${e.isUlt ? ' (ult)' : ''}</div>`
  ).join('');
}

function render() { renderPool(); renderPlayers(); renderControls(); renderLog(); renderBotPanel(); }

document.getElementById('bot-pick-btn').addEventListener('click', botPickNow);
document.getElementById('undo-pick-btn').addEventListener('click', undoPick);
document.getElementById('bot-panel').addEventListener('mouseover', (e) => {
  const el = e.target.closest('[data-col]');
  if (el) showBotTip(el); else hideBotTip();
});
document.getElementById('bot-panel').addEventListener('mouseleave', hideBotTip);
// Enter = Bot pick, except while typing (synergy editor inputs, selects) or with
// the screenshot import dialog open. preventDefault stops a focused button
// (e.g. Bot pick itself, after a mouse click) from also firing on Enter.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.repeat) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (document.getElementById('screenshot-review-overlay').style.display !== 'none') return;
  if (document.getElementById('bot-pick-btn').disabled) return;
  e.preventDefault();
  botPickNow();
});

document.getElementById('reset-btn').addEventListener('click', initDraft);

function toggleSynergyEditMode() {
  synergyEditMode = !synergyEditMode;
  synergyFocus = null;
  document.getElementById('synergy-toggle-btn').textContent = synergyEditMode ? 'Return to draft' : 'See/edit synergies';
  document.getElementById('clear-overrides-btn').style.display = synergyEditMode ? '' : 'none';
  render();
  botDecisionCache = null; // synergy overrides may have changed
}
document.getElementById('synergy-toggle-btn').addEventListener('click', toggleSynergyEditMode);

document.getElementById('clear-overrides-btn').addEventListener('click', () => {
  if (SYNERGY_OVERRIDES.size === 0) return;
  if (!confirm(`Clear all ${SYNERGY_OVERRIDES.size} saved synergy override(s)? This can't be undone.`)) return;
  SYNERGY_OVERRIDES.clear();
  persistSynergyOverrides();
  render();
});

document.getElementById('import-screenshot-btn').addEventListener('click', () => {
  document.getElementById('screenshot-file-input').click();
});
document.getElementById('screenshot-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  e.target.value = ''; // allow re-selecting the same file later
  if (file) handleScreenshotFile(file);
});
document.getElementById('calibrate-canvas').addEventListener('click', (e) => {
  if (!calibrationState || calibrationState.points.length >= CALIBRATION_STEPS.length) return;
  const rect = e.target.getBoundingClientRect();
  const scale = calibrationState.displayScale;
  calibrationState.points.push({ x: (e.clientX - rect.left) / scale, y: (e.clientY - rect.top) / scale });
  renderCalibrationCanvas();
  updateCalibrationInstructions();
  if (calibrationState.points.length === CALIBRATION_STEPS.length) finishCalibration();
});
document.getElementById('calibrate-restart-btn').addEventListener('click', () => {
  if (!calibrationState) return;
  calibrationState.points = [];
  renderCalibrationCanvas();
  updateCalibrationInstructions();
});
document.getElementById('screenshot-remark-btn').addEventListener('click', () => {
  if (!calibrationState) return;
  calibrationState.points = [];
  document.getElementById('screenshot-calibrate-step').style.display = 'block';
  document.getElementById('screenshot-crop-review-step').style.display = 'none';
  renderCalibrationCanvas();
  updateCalibrationInstructions();
});
document.getElementById('screenshot-cancel-btn-calibrate').addEventListener('click', () => {
  document.getElementById('screenshot-review-overlay').style.display = 'none';
});
document.getElementById('screenshot-cancel-btn').addEventListener('click', () => {
  document.getElementById('screenshot-review-overlay').style.display = 'none';
});
document.getElementById('screenshot-confirm-btn').addEventListener('click', () => {
  document.getElementById('screenshot-review-overlay').style.display = 'none';
  if (pendingScreenshotItems) initDraftFromScreenshotPool(pendingScreenshotItems);
});

loadData().catch(err => {
  console.error('loadData failed:', err);
  document.getElementById('pool-loading').textContent = 'Failed to load ability data: ' + err.message;
});
</script>
</body>
</html>
